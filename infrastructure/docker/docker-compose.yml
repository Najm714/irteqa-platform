# infrastructure/docker/docker-compose.yml
version: '3.8'

services:
  # ============================================================
  # ✅ MongoDB - قاعدة البيانات
  # ============================================================
  mongodb:
    image: mongo:7
    container_name: irteqa-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: irteqa
    volumes:
      - mongodb_data:/data/db
    networks:
      - irteqa-network

  # ============================================================
  # ✅ Backend - الخادم
  # ============================================================
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: irteqa-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/irteqa?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key
      STORAGE_PROVIDER: local
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - irteqa-network

  # ============================================================
  # ✅ Nginx - خادم الويب (Reverse Proxy)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: irteqa-nginx
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/portal-a/dist:/usr/share/nginx/html/portal-a:ro
      - ../../frontend/portal-b/dist:/usr/share/nginx/html/portal-b:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - irteqa-network

volumes:
  mongodb_data:
  backend_uploads:
  backend_logs:
  nginx_logs:

networks:
  irteqa-network:
    driver: bridge